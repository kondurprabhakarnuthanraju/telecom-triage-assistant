<!DOCTYPE html>
<html>
<head>
    <title>Network Incident Triage</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: system-ui, sans-serif; background:#0a0e17; color:#e0e7ff; padding:20px; }
        .container { max-width:1200px; margin:0 auto; }
        h1 { color:#60a5fa; margin-bottom:10px; }
        .grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
        @media(max-width:768px){ .grid { grid-template-columns:1fr; } }
        .card { background:#1e293b; border-radius:12px; padding:20px; border:1px solid #334155; }
        .card h2 { color:#94a3b8; font-size:14px; text-transform:uppercase; margin-bottom:12px; }
        textarea { width:100%; height:200px; background:#0f172a; border:1px solid #334155; border-radius:8px; color:#e0e7ff; padding:12px; font-family:monospace; resize:vertical; font-size:12px; }
        .btn { background:#3b82f6; color:white; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; margin-top:10px; margin-right:8px; }
        .btn-secondary { background:#1e293b; border:1px solid #334155; }
        .btn-group { display:flex; gap:10px; flex-wrap:wrap; }
        .incident-card { background:#0f172a; border-radius:8px; padding:16px; margin-bottom:12px; border-left:4px solid #3b82f6; }
        .incident-card.critical { border-left-color:#ef4444; }
        .incident-card.high { border-left-color:#f59e0b; }
        .incident-card.medium { border-left-color:#3b82f6; }
        .incident-card.low { border-left-color:#22d3ee; }
        .incident-header { display:flex; justify-content:space-between; margin-bottom:8px; }
        .incident-severity { font-size:12px; padding:2px 10px; border-radius:12px; font-weight:600; }
        .severity-CRITICAL { background:#7f1d1d; color:#fca5a5; }
        .severity-HIGH { background:#78350f; color:#fcd34d; }
        .severity-MEDIUM { background:#1e3a5f; color:#93c5fd; }
        .severity-LOW { background:#064e3b; color:#6ee7b7; }
        .incident-details { color:#94a3b8; font-size:14px; margin-top:8px; }
        .loading { display:none; color:#60a5fa; margin:10px 0; }
        .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:16px; }
        .stat { background:#0f172a; padding:12px; border-radius:8px; text-align:center; }
        .stat-value { font-size:24px; font-weight:700; color:#60a5fa; }
        .stat-label { font-size:12px; color:#94a3b8; }
        .escalated { background:#7f1d1d; color:#fca5a5; padding:2px 10px; border-radius:12px; font-size:12px; font-weight:600; display:inline-block; }
        .noise-badge { background:#1e293b; color:#94a3b8; padding:2px 10px; border-radius:12px; font-size:12px; display:inline-block; }
        code { background:#1e293b; padding:2px 6px; border-radius:4px; font-size:12px; color:#60a5fa; }
        .summary { color:#94a3b8; font-size:13px; }
        .citation { font-size:12px; color:#64748b; margin-top:4px; }
    </style>
</head>
<body>
<div class="container">
    <h1>📡 Network Incident Triage Assistant</h1>
    <p style="color:#94a3b8;margin-bottom:20px;">Groups network alerts into incidents, consults runbooks, recommends actions.</p>
    <div class="grid">
        <div class="card">
            <h2>📥 Input Alerts</h2>
            <textarea id="alertsInput" placeholder='Paste alert JSON here or click "Load Sample"'></textarea>
            <div class="btn-group">
                <button class="btn" onclick="processAlerts()">🚀 Triage</button>
                <button class="btn btn-secondary" onclick="loadSample()">📋 Load Sample</button>
                <button class="btn btn-secondary" onclick="clearInput()">🗑️ Clear</button>
            </div>
            <div id="loading" class="loading">⏳ Processing alerts...</div>
        </div>
        <div class="card">
            <h2>📊 Results</h2>
            <div id="results"><p style="color:#64748b;text-align:center;padding:40px 0;">Submit alerts to see results</p></div>
        </div>
    </div>
</div>

<script>
async function loadSample() {
    try {
        const response = await fetch('/api/generate-sample-alerts', {
            method: 'POST'
        });
        const data = await response.json();
        document.getElementById('alertsInput').value = JSON.stringify(data.alerts, null, 2);
    } catch (e) {
        alert('Error loading sample: ' + e.message);
    }
}

function clearInput() {
    document.getElementById('alertsInput').value = '';
    document.getElementById('results').innerHTML = '<p style="color:#64748b;text-align:center;padding:40px 0;">Submit alerts to see results</p>';
}

async function processAlerts() {
    const input = document.getElementById('alertsInput').value;
    if (!input.trim()) {
        alert('Please enter alerts first or click "Load Sample"!');
        return;
    }
    
    document.getElementById('loading').style.display = 'block';
    document.getElementById('results').innerHTML = '<p style="color:#60a5fa;">Processing...</p>';
    
    try {
        const alerts = JSON.parse(input);
        const response = await fetch('/api/triage', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ alerts: alerts })
        });
        
        if (!response.ok) {
            throw new Error('Server error: ' + response.status);
        }
        
        const data = await response.json();
        displayResults(data);
    } catch (e) {
        document.getElementById('results').innerHTML = '<p style="color:#ef4444;">❌ Error: ' + e.message + '</p>';
    } finally {
        document.getElementById('loading').style.display = 'none';
    }
}

function displayResults(data) {
    let html = `
        <div class="stats">
            <div class="stat">
                <div class="stat-value">${data.total_alerts}</div>
                <div class="stat-label">Total Alerts</div>
            </div>
            <div class="stat">
                <div class="stat-value">${data.incidents_created}</div>
                <div class="stat-label">Incidents</div>
            </div>
            <div class="stat">
                <div class="stat-value">${data.noise_alerts.length}</div>
                <div class="stat-label">Noise</div>
            </div>
        </div>
    `;

    if (data.incidents.length === 0) {
        html += `<p style="color:#64748b;">No incidents detected. All alerts marked as noise.</p>`;
    }

    data.incidents.forEach((inc, i) => {
        const severityClass = inc.severity.toLowerCase();
        const isEscalated = inc.human_escalation;
        
        html += `
            <div class="incident-card ${severityClass}">
                <div class="incident-header">
                    <span><strong>#${i+1}: ${inc.primary_type}</strong></span>
                    <span class="incident-severity severity-${inc.severity}">${inc.severity}</span>
                </div>
                <div class="incident-details">
                    <div>📊 <strong>${inc.alerts.length}</strong> related alerts</div>
                    <div>🎯 Priority Score: <strong>${inc.priority_score}</strong>/10</div>
                    ${isEscalated ? '<div><span class="escalated">🚨 ESCALATED TO HUMAN</span></div>' : ''}
                    ${inc.escalation_reason ? `<div style="color:#fcd34d;font-size:13px;">Reason: ${inc.escalation_reason}</div>` : ''}
                    <div style="margin-top:8px;color:#e0e7ff;"><strong>Action:</strong> ${inc.recommended_action}</div>
                    ${inc.runbook_citation && inc.runbook_citation !== "No runbook found" ? `<div class="citation">📚 Cited from: <code>${inc.runbook_citation}</code></div>` : ''}
                    <div style="margin-top:4px;font-size:12px;color:#64748b;">Status: ${inc.status}</div>
                </div>
            </div>
        `;
    });

    if (data.noise_alerts.length > 0) {
        html += `
            <div style="margin-top:12px;">
                <span class="noise-badge">🔇 ${data.noise_alerts.length} alerts marked as noise</span>
                <details style="margin-top:8px;">
                    <summary style="color:#64748b;font-size:13px;cursor:pointer;">View noise alert IDs</summary>
                    <div style="margin-top:4px;padding:8px;background:#0f172a;border-radius:4px;font-size:11px;color:#94a3b8;word-wrap:break-word;">${data.noise_alerts.join(', ')}</div>
                </details>
            </div>
        `;
    }

    document.getElementById('results').innerHTML = html;
}

// Load sample alerts automatically on page load
document.addEventListener('DOMContentLoaded', function() {
    loadSample();
});
</script>
</body>
</html>
